{% extends "base.html" %}

{% block page_content %}
<div class="page-header">
    <h1>PRA3 Chatbot</h1>
    <p>Signed in as <strong>{{ name }}</strong> ({{ email }}).</p>
</div>

<div id="conversation" class="well" aria-live="polite">
    <p><strong>Bot:</strong> Hello! Tell me something that I should remember.</p>
</div>

<form id="chat-form">
    <div class="form-group">
        <label for="message">Message</label>
        <input id="message" name="message" class="form-control" type="text" maxlength="500" autocomplete="off" required>
    </div>
    <button class="btn btn-primary" type="submit">Send</button>
</form>

<hr>

<form action="{{ url_for('logout') }}" method="post">
    <button class="btn btn-danger" type="submit">Logout</button>
</form>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
(() => {
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");
    const conversation = document.getElementById("conversation");

    function addMessage(speaker, message) {
        const paragraph = document.createElement("p");
        const label = document.createElement("strong");
        label.textContent = `${speaker}: `;
        paragraph.append(label, document.createTextNode(message));
        conversation.appendChild(paragraph);
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) return;

        addMessage("You", message);
        input.value = "";
        input.disabled = true;

        try {
            const response = await fetch("{{ url_for('chat') }}", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message}),
            });
            const data = await response.json();
            addMessage("Bot", data.reply);
        } catch (error) {
            addMessage("Bot", "I could not send that message. Please try again.");
        } finally {
            input.disabled = false;
            input.focus();
        }
    });
})();
</script>
{% endblock %}
